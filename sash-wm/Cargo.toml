# SPDX-License-Identifier: Apache-2.0

[package]
name = "sash-wm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Debug recording (docs/DEBUG.md): debug builds only, enabled at runtime by
# SASH_DEBUG_RECORD. A release build with this feature fails to compile.
debug-record = []

[dependencies]
# Debug-only offscreen capture (SIGUSR1): signal source and PNG encoder.
calloop = { version = "0.14", features = ["signals"] }
png = "0.18"
# Release builds ignore SIGUSR1 (signal(SIG_IGN)).
nix = { version = "0.31", default-features = false, features = ["signal", "fs"] }
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "desktop", "wayland_frontend", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cursor theme files (owner, M11a; MIT, already in the tree through Smithay).
xcursor = "=0.3.11"

[dev-dependencies]
proptest = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# The layer-shell test client (tests only; already in the tree through Smithay).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
